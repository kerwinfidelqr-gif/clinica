{% extends "core/base.html" %}
{% block content %}
<h2 class="text-3xl font-bold text-gray-800 mb-6 border-b-2 border-gray-400 pb-2">Pacientes</h2>
<div class="max-w-xl mx-auto bg-white p-8 rounded-lg shadow-md mt-10">
    <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b-2 border-gray-400 pb-2">
        {% if paciente %} Editar expediente: {{ paciente.nombre }} {% else %} Registrar nuevo paciente {% endif %}
    </h2>
    <form method="post" class="space-y-6">
        {% csrf_token %}
        <div class="space-y-4">
            {% for field in form %}
            <div class="flex items-center space-x-4">
                <label class="text-sm font-medium text-gray-700 w-1/3">{{ field.label }}</label>
                <div class="w-2/3">{{ field }}</div>
            </div>
            {% endfor %}
        </div>
        <div class="flex justify-end space-x-4">
            <a href="{% url 'pacientes:paciente_list' %}" class="bg-gray-300 py-2 px-6 rounded-lg">Cancelar</a>
            <button type="submit" class="bg-[#233b6e] text-white py-2 px-6 rounded-lg">
                {% if paciente %}Actualizar{% else %}Crear{% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
