{% extends "core/base.html" %}
{% load static %}
{% block title %}Crear nuevo Paciente{% endblock %}
{% block content %}

<h2 class="text-3xl font-bold text-gray-800 mb-6 border-b-2 border-gray-400 pb-2">Pacientes</h2>

<div class="max-w-xl mx-auto bg-white p-8 rounded-lg shadow-md mt-10">
    <h2 class="text-3x1 font-bold text-gray-800 mb-6 border-b-2 border-gray-400 pb-2">Registrar nuevo paciente</h2>
    <form method="post" class="space-y-6">
        {% csrf_token %}
        <div class="space-y-4">
            <div class="flex items-center space-x-4">
                <label for="{{ form.id_paciente.id_for_label }}" class="block text-sm font-medium text-gray-700 w-1/3">ID Paciente</label>
                <div class="mt-1 w-2/3">
                    <input type="text" name="{{ form.id_paciente.html_name }}" id="{{ form.id_paciente.id_for_label }}" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus: outline-none focus:ring-2 focus:ring-[#233b6e]">
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <label for="{{ form.nombre.id_for_label }}" class="block text-sm font-medium text-gray-700 w-1/3">Nombre</label>
                <div class="mt-1 w-2/3">
                    <input type="text" name="{{ form.nombre.html_name }}" id="{{ form.nombre.id_for_label }}" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus: outline-none focus:ring-2 focus:ring-[#233b6e]">
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <label for="{{ form.DNI.id_for_label }}" class="block text-sm font-medium text-gray-700 w-1/3">DNI</label>
                <div class="mt-1 w-2/3">
                    <input type="number" name="{{ form.DNI.html_name }}" id="{{ form.DNI.id_for_label }}" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus: outline-none focus:ring-2 focus:ring-[#233b6e]">
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <label for="{{ form.lugar_nacimiento.id_for_label }}" class="block text-sm font-medium text-gray-700 w-1/3">Lugar de Nacimiento</label>
                <div class="mt-1 w-2/3">
                    <input type="text" name="{{ form.lugar_nacimiento.html_name }}" id="{{ form.lugar_nacimiento.id_for_label }}" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus: outline-none focus:ring-2 focus:ring-[#233b6e]">
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <label for="{{ form.edad.id_for_label }}" class="block text-sm font-medium text-gray-700 w-1/3">Edad</label>
                <div class="mt-1 w-2/3">
                    <input type="number" name="{{ form.edad.html_name }}" id="{{ form.edad.id_for_label }}" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus: outline-none focus:ring-2 focus:ring-[#233b6e]">
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <label for="{{ form.sexo.id_for_label }}" class="block text-sm font-medium text-gray-700 w-1/3">Sexo</label>
                <div class="mt-1 w-2/3">
                    <select name="{{ form.sexo.html_name }}" id="{{ form.sexo.id_for_label }}" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus: outline-none focus:ring-2 focus:ring-[#233b6e]">
                        <option value="Femenino">Femenino</option>
                        <option value="Masculino">Masculino</option>
                    </select>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <label for="{{ form.estado_civil.id_for_label }}" class="block text-sm font-medium text-gray-700 w-1/3">Estado Civil</label>
                <div class="mt-1 w-2/3">
                    <select name="{{ form.estado_civil.html_name }}" id="{{ form.estado_civil.id_for_label }}" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus: outline-none focus:ring-2 focus:ring-[#233b6e]">
                        <option value="Soltero">Soltero</option>
                        <option value="Casado">Casado</option>
                    </select>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <label for="{{ form.domicilio_actual.id_for_label }}" class="block text-sm font-medium text-gray-700 w-1/3">Domicilio actual</label>
                <div class="mt-1 w-2/3">
                    <input type="text" name="{{ form.domicilio_actual.html_name }}" id="{{ form.domicilio_actual.id_for_label }}" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus: outline-none focus:ring-2 focus:ring-[#233b6e]">
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <label for="{{ form.domicilio_procedencia.id_for_label }}" class="block text-sm font-medium text-gray-700 w-1/3">Domicilio procedencia</label>
                <div class="mt-1 w-2/3">
                    <input type="text" name="{{ form.domicilio_procedencia.html_name }}" id="{{ form.domicilio_procedencia.id_for_label }}" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus: outline-none focus:ring-2 focus:ring-[#233b6e]">
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <label for="{{ form.celular.id_for_label }}" class="block text-sm font-medium text-gray-700 w-1/3">Celular</label>
                <div class="mt-1 w-2/3">
                    <input type="number" name="{{ form.celular.html_name }}" id="{{ form.celular.id_for_label }}" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus: outline-none focus:ring-2 focus:ring-[#233b6e]">
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <label for="{{ form.ocupacion.id_for_label }}" class="block text-sm font-medium text-gray-700 w-1/3">Ocupacion</label>
                <div class="mt-1 w-2/3">
                    <input type="text" name="{{ form.ocupacion.html_name }}" id="{{ form.ocupacion.id_for_label }}" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus: outline-none focus:ring-2 focus:ring-[#233b6e]">
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <label for="{{ form.fecha_ingreso.id_for_label }}" class="block text-sm font-medium text-gray-700 w-1/3">Fecha de Ingreso</label>
                <div class="mt-1 w-2/3">
                    <input type="date" name="{{ form.fecha_ingreso.html_name }}" id="{{ form.fecha_ingreso.id_for_label }}" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus: outline-none focus:ring-2 focus:ring-[#233b6e]">
                </div>
            </div>
        </div>
        <div class="flex justify-end space-x-4">
            <a href="{% url 'pacientes:paciente_list' %}" class="bg-gray-300 text-gray-800 font-semibold py-2 px-6 rounded-lg transition-colors duration-300 hover:bg-gray-400">Cancelar</a>
            <button type="submit" class="bg-[#233b6e] text-white font-semibold py-2 px-6 rounded-lg transition-colors duration-300 hover:bg-[#1a2c53]">Crear</button>
        </div>
    </form>
</div>
{% endblock content %}
